version: "2"

linters:
  exclusions:
    rules:
      # Error messages are exported constants that callers compare against
      - linters: [staticcheck]
        text: "ST1005:"
      # Unexported Player fields with JSON tags, see #15
      - path: pkg/game/Player.go
        linters: [govet, staticcheck]
        text: "structtag:|SA5008:"
      # Bot ignores action errors, see #16
      - path: pkg/game/Bot.go
        linters: [errcheck]
